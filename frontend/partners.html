<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درخواست همکاری | دیجی‌بایل پی"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"><style>
:root{--bg:#f7f4fb;--surface:#fff;--fg:#201432;--muted:#70617f;--line:#e2d8ef;--accent:#f5a400;--brand:#3b1f6b}*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.8 Vazirmatn,Tahoma,sans-serif}.wrap{max-width:700px;margin:auto}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}h1{font-size:1.3rem;margin:0}p{color:var(--muted)}label{display:block;color:var(--muted);font-size:.86rem;margin:12px 0 4px}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg)}textarea{min-height:90px}.btn{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 15px;background:#fff;color:var(--fg);text-decoration:none;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.msg{padding:10px;border-radius:10px;background:#fff7e2;margin-top:12px}.err{color:#a1263f}.ok{color:#13795b}
</style></head><body><main class="wrap"><section class="card"><h1>درخواست همکاری با دیجی‌بایل پی</h1><p>این فرم درخواست آزمایشی را در دیتابیس Codespaces ذخیره می‌کند؛ هنوز به فرایند پذیرش واقعی یا قرارداد همکاری متصل نیست.</p><form id="f"><label for="kind">نوع همکاری</label><select id="kind"><option value="merchant">پذیرنده</option><option value="agent">نماینده</option><option value="organization">سازمان</option></select><label for="name">نام و نام خانوادگی</label><input id="name" required minlength="2"><label for="company">نام کسب‌وکار یا سازمان (اختیاری)</label><input id="company"><label for="phone">شماره موبایل</label><input id="phone" dir="ltr" inputmode="numeric" maxlength="11" placeholder="09123456789" required><label for="message">توضیحات</label><textarea id="message"></textarea><button class="btn primary" id="send">ثبت درخواست</button> <a class="btn" href="/">بازگشت به سایت</a></form><div id="out" class="msg" hidden></div></section></main><script>
const $=s=>document.querySelector(s),EN=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const q=new URLSearchParams(location.search).get('type');if(['merchant','agent','organization'].includes(q))$('#kind').value=q;
$('#f').onsubmit=async e=>{e.preventDefault();const b={kind:$('#kind').value,name:$('#name').value.trim(),company:$('#company').value.trim(),phone:EN($('#phone').value).trim(),message:$('#message').value.trim()};$('#send').disabled=true;const out=$('#out');try{const r=await fetch('/api/v1/public/partnership-applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'ثبت درخواست ناموفق بود');out.className='msg ok';out.textContent=(j.data||j).message||'درخواست ثبت شد.';$('#f').reset()}catch(err){out.className='msg err';out.textContent=err.message}finally{out.hidden=false;$('#send').disabled=false}};
</script></body></html>
