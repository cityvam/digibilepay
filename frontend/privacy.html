<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حریم خصوصی | دیجی‌بایل پی"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"><style>body{margin:0;padding:24px 16px;background:#f7f4fb;color:#201432;font:16px/2 Vazirmatn,Tahoma,sans-serif}.wrap{max-width:850px;margin:auto;background:#fff;border:1px solid #e2d8ef;border-radius:18px;padding:24px}h1{font-size:1.35rem}.note{background:#fff7e2;padding:12px;border-radius:10px;color:#795400}.btn{display:inline-block;padding:8px 14px;border:1px solid #e2d8ef;border-radius:10px;text-decoration:none;color:inherit}</style></head><body><main class="wrap"><h1>حریم خصوصی</h1><p class="note">این متن برای پیش‌نمایش است. قبل از انتشار عمومی باید با فرایندهای واقعی نگهداری داده، رضایت‌گیری و حذف اطلاعات تطبیق داده شود.</p><h2>اطلاعات ثبت‌شده</h2><p>در محیط آزمایشی Codespaces اطلاعات حساب، درخواست‌های آزمایشی و فایل‌های بارگذاری‌شده ممکن است در دیتابیس SQLite همان محیط ذخیره شوند. از اطلاعات واقعی مشتریان، تصاویر واقعی مدارک یا رمزهای اصلی استفاده نکنید.</p><h2>اتصال‌های غیرفعال</h2><p>در نسخهٔ پیش‌نمایش پیامک، OCR، استعلام بانک و پرداخت واقعی اجرا نمی‌شوند. کد ثابت OTP فقط برای تست محلی است.</p><h2>کنترل حساب</h2><p>کاربر می‌تواند از حساب خارج شود و از طریق صفحهٔ بازیابی رمز، رمز محلی حساب آزمایشی را تغییر دهد.</p><p><a class="btn" href="/support.html">پشتیبانی</a> <a class="btn" href="/">بازگشت به سایت</a></p></main></body></html>
