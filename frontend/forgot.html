<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی رمز عبور | دیجی‌بایل پی"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#130c1f;--surface:#1d1330;--line:#3a2c52;--fg:#f3edfb;--muted:#a99bc0;--accent:#ffb629;--bad:#ff8a9a;--ok:#5fd6a0;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--fg);font:16px/1.8 Vazirmatn,Tahoma,sans-serif}.card{width:min(440px,100%);padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px}h1{font-size:1.2rem;margin:0}.sub{color:var(--muted);font-size:.87rem}label{display:block;color:var(--muted);font-size:.84rem;margin:12px 0 4px}input{width:100%;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:8px 12px}.ltr{direction:ltr;text-align:left}.cap{display:flex;gap:8px;align-items:center}.cap img{height:46px;max-width:48%;border-radius:8px}.cap input{flex:1}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;min-height:48px;background:var(--accent);color:#281900;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.msg{margin-top:12px;padding:9px;border-radius:9px;background:rgba(255,255,255,.05);white-space:pre-wrap}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}[hidden]{display:none!important}.row{display:flex;justify-content:space-between;gap:10px}.row a{color:var(--accent);text-decoration:none}
</style></head><body><main class="card"><div class="row"><h1>بازیابی رمز عبور</h1><a href="/login.html">بازگشت به ورود</a></div><p class="sub">شمارهٔ موبایل حساب را تأیید کنید و رمز تازه بسازید.</p>
<form id="request"><label for="phone">شماره موبایل</label><input id="phone" class="ltr" inputmode="numeric" maxlength="11" placeholder="09123456789" required><label for="captcha">کد امنیتی تصویر</label><div class="cap"><img id="captchaImage" alt="کد امنیتی"><button type="button" id="refresh" class="btn" style="width:auto;margin:0;padding:0 12px">↻</button><input id="captcha" class="ltr" inputmode="numeric" maxlength="5" required></div><button class="btn" id="send">ارسال کد تأیید</button></form>
<form id="reset" hidden><label for="otp">کد یک‌بارمصرف ۶ رقمی</label><input id="otp" class="ltr" inputmode="numeric" maxlength="6" placeholder="123456" required><label for="pw">رمز جدید (حداقل ۸ نویسه)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">تکرار رمز جدید</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="btn" id="save">تغییر رمز عبور</button></form><div id="msg" class="msg" hidden role="alert"></div></main>
<script>
const $=s=>document.querySelector(s),EN=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
let captchaId='',ticket='',phone='';
function message(t,kind='bad'){$('#msg').hidden=!t;$('#msg').className='msg '+kind;$('#msg').textContent=t}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'درخواست ناموفق بود.');return j}
async function loadCaptcha(){const r=await fetch('/api/v1/security/captcha?'+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.message||'کد امنیتی بارگذاری نشد.');captchaId=j.id;$('#captchaImage').src=j.image;$('#captcha').value=''}
$('#refresh').onclick=()=>loadCaptcha().catch(e=>message(e.message));
$('#request').onsubmit=async e=>{e.preventDefault();message('');phone=EN($('#phone').value).trim();const cap=EN($('#captcha').value).trim();if(!/^09\d{9}$/.test(phone)||cap.length!==5){message('شماره موبایل ۱۱ رقمی و کد امنیتی ۵ رقمی را کامل کنید.');return}
$('#send').disabled=true;try{await api('/api/v1/security/otp/request',{phone,purpose:'reset',captchaId,captchaAnswer:cap});$('#request').hidden=true;$('#reset').hidden=false;message('درخواست ثبت شد. در پیش‌نمایش Codespaces پیامک ارسال نمی‌شود؛ کد آزمایشی 123456 است.','ok')}catch(err){message(err.message);loadCaptcha().catch(()=>{})}finally{$('#send').disabled=false}};
$('#reset').onsubmit=async e=>{e.preventDefault();message('');const pw=EN($('#pw').value);if(pw.length<8){message('رمز باید حداقل ۸ نویسه باشد.');return}if(pw!==EN($('#confirm').value)){message('تکرار رمز یکسان نیست.');return}
$('#save').disabled=true;try{const ver=await api('/api/v1/security/otp/verify',{phone,code:EN($('#otp').value),purpose:'reset'});ticket=ver.ticket;if(!ticket)throw new Error('تأیید شماره کامل نشد.');await api('/api/v1/security/password/reset',{ticket,password:pw});message('رمز عبور تغییر کرد. اکنون وارد شوید.','ok');setTimeout(()=>location.replace('/login.html'),1000)}catch(err){message(err.message)}finally{$('#save').disabled=false}};
loadCaptcha().catch(e=>message(e.message));
</script></body></html>
