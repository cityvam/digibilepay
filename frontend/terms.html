<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قوانین و مقررات | دیجی‌بایل پی"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"><style>body{margin:0;padding:24px 16px;background:#f7f4fb;color:#201432;font:16px/2 Vazirmatn,Tahoma,sans-serif}.wrap{max-width:850px;margin:auto;background:#fff;border:1px solid #e2d8ef;border-radius:18px;padding:24px}h1{font-size:1.35rem}.note{background:#fff7e2;padding:12px;border-radius:10px;color:#795400}.btn{display:inline-block;padding:8px 14px;border:1px solid #e2d8ef;border-radius:10px;text-decoration:none;color:inherit}</style></head><body><main class="wrap"><h1>قوانین و مقررات</h1><p class="note">این صفحه متن اولیهٔ پیش‌نمایش است و تا تأیید حقوقی، قرارداد یا پیشنهاد معتبر و نهایی محسوب نمی‌شود.</p><h2>۱. ماهیت خدمات</h2><p>خدمات، شرایط اعتبار، مبلغ، کارمزد، پیش‌پرداخت و تعداد اقساط هر طرح باید پیش از استفاده به‌طور شفاف به کاربر اعلام و توسط مسئولان مجاز تأیید شود. مبالغ نمایشی طرح‌ها الزام‌آور نیستند.</p><h2>۲. صحت اطلاعات</h2><p>کاربر باید اطلاعات را دقیق وارد کند. ثبت اطلاعات در محیط پیش‌نمایش صرفاً برای آزمون نرم‌افزار است و نباید برای درخواست واقعی تسهیلات استفاده شود.</p><h2>۳. قرارداد و پرداخت</h2><p>هیچ قرارداد، امضا، تسویه یا انتقال وجهی در محیط Codespaces معتبر یا واقعی تلقی نمی‌شود. فرایندهای بانکی و پرداخت تا اتصال و آزمون سامانهٔ عملیاتی غیرفعال‌اند.</p><h2>۴. پشتیبانی</h2><p>در صورت نیاز به توضیح دربارهٔ نسخهٔ آزمایشی، از صفحهٔ پشتیبانی استفاده کنید.</p><p><a class="btn" href="/support.html">پشتیبانی</a> <a class="btn" href="/">بازگشت به سایت</a></p></main></body></html>
